name: Bug report
description: Report a reproducible problem with Dari Course Format.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, learner names, chat transcripts, or other private data. Report security vulnerabilities privately; see SECURITY.md."
  - type: input
    id: plugin
    attributes:
      label: Dari version
      placeholder: "2.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: "Moodle™ version, PHP version, database, theme, and browser."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: "Include the expected result and the actual result."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitised screenshots or debugging output
      description: "Remove names, student data, credentials, and private course content."

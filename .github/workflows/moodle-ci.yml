name: Moodle Plugin CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moodle-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle-branch: MOODLE_404_STABLE
            php: '8.3'
            database: pgsql
          - moodle-branch: MOODLE_405_STABLE
            php: '8.3'
            database: mariadb
          - moodle-branch: MOODLE_500_STABLE
            php: '8.3'
            database: pgsql
          - moodle-branch: MOODLE_503_STABLE
            php: '8.3'
            database: mariadb
    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3
    steps:
      - name: Check out plugin
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, intl, soap, gd, zip
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none
      - name: Set up moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"
      - name: Keep the CI debug helper
        run: cp plugin/.github/ci-annotate.sh "$GITHUB_WORKSPACE/ci-annotate.sh"
      - name: Install test environment
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
      - name: Validate modern CSS grammar without relaxing lint rules
        run: |
          npm --prefix moodle install --no-save --ignore-scripts --no-audit --no-fund stylelint-csstree-validator@3.1.0
          cd moodle
          node ../plugin/.github/check-css-grammar.cjs
      - name: PHP syntax
        if: ${{ !cancelled() }}
        run: bash "$GITHUB_WORKSPACE/ci-annotate.sh" 'phplint' moodle-plugin-ci phplint
      - name: Moodle coding standards
        if: ${{ !cancelled() }}
        run: bash "$GITHUB_WORKSPACE/ci-annotate.sh" 'phpcs' moodle-plugin-ci phpcs --max-warnings 0
      - name: PHPDoc
        if: ${{ !cancelled() }}
        run: bash "$GITHUB_WORKSPACE/ci-annotate.sh" 'phpdoc' moodle-plugin-ci phpdoc --max-warnings 0
      - name: Plugin validation
        if: ${{ !cancelled() }}
        run: bash "$GITHUB_WORKSPACE/ci-annotate.sh" 'validate' moodle-plugin-ci validate
      - name: Upgrade savepoints
        if: ${{ !cancelled() }}
        run: bash "$GITHUB_WORKSPACE/ci-annotate.sh" 'savepoints' moodle-plugin-ci savepoints
      - name: Mustache templates
        if: ${{ !cancelled() }}
        run: bash "$GITHUB_WORKSPACE/ci-annotate.sh" 'mustache' moodle-plugin-ci mustache
      - name: JavaScript checks
        if: ${{ !cancelled() }}
        run: bash "$GITHUB_WORKSPACE/ci-annotate.sh" 'grunt' moodle-plugin-ci grunt --max-lint-warnings 0
      - name: PHPUnit
        if: ${{ !cancelled() }}
        run: bash "$GITHUB_WORKSPACE/ci-annotate.sh" 'phpunit' moodle-plugin-ci phpunit --fail-on-warning
      - name: Behat browser scenarios
        if: ${{ !cancelled() }}
        run: bash "$GITHUB_WORKSPACE/ci-annotate.sh" 'behat' moodle-plugin-ci behat --profile chrome
      - name: Export exact AMD rebuild evidence after failed validation
        id: amd_reference
        if: ${{ failure() && !cancelled() }}
        run: |
          pluginpath="$(dirname "$(find moodle -path '*/course/format/dari/version.php' -print -quit)")"
          test -n "$pluginpath"
          cd moodle
          npx grunt amd --root="${pluginpath#moodle/}"
          cd ..
          tar -C "$pluginpath" -czf amd-reference.tgz amd/build
      - name: Save AMD rebuild evidence
        if: ${{ failure() && !cancelled() && steps.amd_reference.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: amd-reference-${{ matrix.moodle-branch }}
          path: amd-reference.tgz
          retention-days: 7
